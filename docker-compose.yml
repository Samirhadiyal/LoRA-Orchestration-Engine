# Path: docker-compose.yml

services:
  # 1. Message Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Vector Database (RAG)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 3. State Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: neuromesh
      POSTGRES_PASSWORD: neuromesh_password
      POSTGRES_DB: neuromesh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuromesh -d neuromesh_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Core LangGraph Router / API
  router:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    ports:
      - "8000:8000"
    environment:
      - NEUROMESH_SWARM_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://neuromesh:neuromesh_password@postgres:5432/neuromesh_db
      - QDRANT_URL=http://qdrant:6333
      - LLM_API_KEY=dummy_api_key_to_pass_validation
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  # 5. Specialized Edge Swarm Workers
  swarm-workers:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
    environment:
      - NEUROMESH_MODE=edge
      - REDIS_URL=redis://redis:6379/0
      # Uses SQLite via EdgeConfig to save RAM, but listens to central Redis queue
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
